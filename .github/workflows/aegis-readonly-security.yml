name: AEGIS Read-only Security Baseline

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, "security/**"]
  schedule:
    - cron: "23 10 * * 1-5"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aegis-security-baseline-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-security:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout without persisted credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install pinned audit tools
        run: python -m pip install --disable-pip-version-check bandit==1.8.6 pip-audit==2.9.0

      - name: Run Bandit when Python source exists
        shell: bash
        run: |
          if find . -type f -name '*.py' -not -path './.git/*' -not -path './.venv/*' -print -quit | grep -q .; then
            set +e
            bandit -r . -x ./.git,./.venv,./venv -f json -o "${RUNNER_TEMP}/bandit.json"
            result=$?
            set -e
            if [ "$result" -gt 1 ]; then exit "$result"; fi
            echo "Bandit completed; findings, if any, are reported in the job output."
          else
            echo "No Python source found; Bandit skipped."
          fi

      - name: Audit requirements files when present
        shell: bash
        run: |
          shopt -s globstar nullglob
          files=(**/requirements*.txt)
          if (("${#files[@]}" == 0)); then
            echo "No requirements*.txt files found; dependency audit skipped."
          else
            for file in "${files[@]}"; do
              echo "Auditing $file"
              pip-audit -r "$file"
            done
          fi
